[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-database"
version = "0.3.0"
description = "Catalogue local et sourcé d'outils et modèles IA"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Franck Auc" }]
dependencies = ["requests>=2.31", "openpyxl>=3.1", "Pillow>=10"]

[project.scripts]
ia-database = "ia_database.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
