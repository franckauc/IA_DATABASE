<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue IA</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --fg: #1a1a1a; --muted: #555; --border: #e5e5e5;
    --header-bg: #1f4e78; --header-fg: #ffffff; --row-hover: #f0f4f8;
    --input-border: #ccc; --link: #1f4e78; --badge-bg: #e5edf5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --fg: #e8e8e8; --muted: #9aa0a6; --border: #2a2d33;
      --header-bg: #2a5c8a; --header-fg: #ffffff; --row-hover: #1e222a;
      --input-border: #444; --link: #7db4e0; --badge-bg: #1e2d3d;
    }
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 2rem; color: var(--fg); background: var(--bg); }
  h1 { margin-bottom: 0.25rem; }
  p.subtitle { color: var(--muted); margin-top: 0; }
  .controls { display: flex; gap: 0.75rem; flex-wrap: wrap; margin: 1.5rem 0; align-items: center; }
  input, select { padding: 0.5rem; font-size: 1rem; border: 1px solid var(--input-border); border-radius: 4px;
    background: var(--bg); color: var(--fg); }
  input[type=search] { flex: 1; min-width: 220px; }
  .status { color: var(--muted); margin-bottom: 0.5rem; font-size: 0.9rem; }
  table { width: 100%; border-collapse: collapse; background: transparent; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: var(--header-bg); color: var(--header-fg); position: sticky; top: 0; cursor: pointer; user-select: none; white-space: nowrap; }
  th.sorted::after { content: " " attr(data-dir); }
  tr:hover td { background: var(--row-hover); }
  .badge { display: inline-block; background: var(--badge-bg); border-radius: 3px; padding: 0.1rem 0.4rem; font-size: 0.8rem; margin: 0.1rem; }
  a { color: var(--link); }
  .table-wrap { max-width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
  .pager { display: flex; gap: 0.5rem; align-items: center; margin: 1rem 0; flex-wrap: wrap; }
  .pager button { padding: 0.4rem 0.8rem; border: 1px solid var(--input-border); border-radius: 4px; background: var(--bg); color: var(--fg); cursor: pointer; }
  .pager button:disabled { opacity: 0.4; cursor: default; }
  small { color: var(--muted); }
</style>
</head>
<body>
<h1>Catalogue IA</h1>
<p class="subtitle">
  Tableau interactif généré à partir de
  <a href="https://github.com/franckauc/IA_DATABASE/blob/main/data/exports/catalogue_ia.csv">data/exports/catalogue_ia.csv</a>
  (rafraîchi automatiquement chaque semaine). Recherche, tri par colonne, pagination — tout se passe dans ton navigateur.
</p>

<div class="controls">
  <input type="search" id="search" placeholder="Rechercher un nom, une description, un éditeur…">
  <select id="type-filter"><option value="">Tous les types</option></select>
  <select id="page-size">
    <option value="25">25 / page</option>
    <option value="50" selected>50 / page</option>
    <option value="100">100 / page</option>
    <option value="250">250 / page</option>
  </select>
</div>

<p class="status" id="status">Chargement du catalogue…</p>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th data-key="name">Nom</th>
        <th data-key="item_type">Type</th>
        <th data-key="company">Éditeur</th>
        <th data-key="categories">Catégories</th>
        <th data-key="downloads">Téléchargements</th>
        <th data-key="official_url">Lien</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div class="pager">
  <button id="prev">← Précédent</button>
  <span id="page-label"></span>
  <button id="next">Suivant →</button>
</div>

<script>
"use strict";

const CSV_URL = "https://raw.githubusercontent.com/franckauc/IA_DATABASE/main/data/exports/catalogue_ia.csv";

// Parseur CSV minimal mais correct : gère les champs entre guillemets,
// virgules et guillemets échappés à l'intérieur d'un champ, et les fins de
// ligne \r\n. Suffisant pour un export interne dont on connaît le format
// (csv.DictWriter), pas prévu pour du CSV arbitraire.
function parseCsv(text) {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1); // BOM (utf-8-sig)
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = "";
      if (row.length > 1 || row[0] !== "") rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows[0];
  return rows.slice(1).map((r) => Object.fromEntries(headers.map((h, idx) => [h, r[idx] ?? ""])));
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[c]);
}

function safeUrl(url) {
  try {
    const parsed = new URL(url);
    return parsed.protocol === "http:" || parsed.protocol === "https:" ? url : null;
  } catch {
    return null;
  }
}

let allRows = [];
let filtered = [];
let sortKey = "name";
let sortDir = 1;
let page = 0;

const statusEl = document.getElementById("status");
const rowsEl = document.getElementById("rows");
const searchEl = document.getElementById("search");
const typeFilterEl = document.getElementById("type-filter");
const pageSizeEl = document.getElementById("page-size");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const pageLabel = document.getElementById("page-label");

function applyFilters() {
  const term = searchEl.value.trim().toLowerCase();
  const type = typeFilterEl.value;
  filtered = allRows.filter((r) => {
    if (type && r.item_type !== type) return false;
    if (!term) return true;
    return (
      (r.name || "").toLowerCase().includes(term) ||
      (r.description || "").toLowerCase().includes(term) ||
      (r.company || "").toLowerCase().includes(term) ||
      (r.categories || "").toLowerCase().includes(term)
    );
  });
  filtered.sort((a, b) => {
    const av = a[sortKey] || "", bv = b[sortKey] || "";
    const an = Number(av), bn = Number(bv);
    const cmp = !isNaN(an) && !isNaN(bn) && av !== "" && bv !== ""
      ? an - bn
      : String(av).localeCompare(String(bv), "fr");
    return cmp * sortDir;
  });
  page = 0;
  render();
}

function render() {
  const pageSize = Number(pageSizeEl.value);
  const maxPage = Math.max(0, Math.ceil(filtered.length / pageSize) - 1);
  page = Math.min(page, maxPage);
  const start = page * pageSize;
  const pageRows = filtered.slice(start, start + pageSize);

  rowsEl.innerHTML = pageRows.map((r) => {
    const link = safeUrl(r.official_url);
    const categories = (r.categories || "").split(",").filter(Boolean)
      .map((c) => `<span class="badge">${escapeHtml(c)}</span>`).join("");
    return `<tr>
      <td>${escapeHtml(r.name)}</td>
      <td>${escapeHtml(r.item_type)}</td>
      <td>${escapeHtml(r.company || "—")}</td>
      <td>${categories || "—"}</td>
      <td>${escapeHtml(r.downloads || "—")}</td>
      <td>${link ? `<a href="${escapeHtml(link)}" target="_blank" rel="noopener">ouvrir</a>` : "—"}</td>
    </tr>`;
  }).join("");

  statusEl.textContent = `${filtered.length.toLocaleString("fr-FR")} fiche(s) sur ${allRows.length.toLocaleString("fr-FR")} au total`;
  pageLabel.textContent = `Page ${page + 1} / ${maxPage + 1}`;
  prevBtn.disabled = page === 0;
  nextBtn.disabled = page >= maxPage;

  document.querySelectorAll("th[data-key]").forEach((th) => {
    th.classList.toggle("sorted", th.dataset.key === sortKey);
    th.dataset.dir = sortDir === 1 ? "▲" : "▼";
  });
}

document.querySelectorAll("th[data-key]").forEach((th) => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) sortDir *= -1;
    else { sortKey = key; sortDir = 1; }
    applyFilters();
  });
});

searchEl.addEventListener("input", applyFilters);
typeFilterEl.addEventListener("change", applyFilters);
pageSizeEl.addEventListener("change", () => { page = 0; render(); });
prevBtn.addEventListener("click", () => { page--; render(); });
nextBtn.addEventListener("click", () => { page++; render(); });

fetch(CSV_URL)
  .then((res) => {
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.text();
  })
  .then((text) => {
    allRows = parseCsv(text);
    const types = [...new Set(allRows.map((r) => r.item_type).filter(Boolean))].sort();
    typeFilterEl.innerHTML = '<option value="">Tous les types</option>' +
      types.map((t) => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");
    applyFilters();
  })
  .catch((err) => {
    statusEl.textContent = `Impossible de charger le catalogue (${err.message}). Réessaie dans quelques instants.`;
  });
</script>
</body>
</html>
